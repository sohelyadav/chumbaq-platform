<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Before anything that loads. No Referer at all: admin paths name tenants, and the
      view-as tab this app opens on the customer site needs nothing from it. nginx and the
      dev server also send it as a header.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chumbaq Admin</title>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
